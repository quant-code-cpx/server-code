# Production Redis: private network only. TLS belongs to managed Redis or outer network layer.
bind 0.0.0.0
port 6379
protected-mode yes

aclfile /usr/local/etc/redis/users.acl

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

save 3600 1
save 300 100
save 60 10000

maxmemory-policy noeviction
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb

loglevel notice
logfile ""
timeout 0
tcp-keepalive 60
slowlog-log-slower-than 10000
slowlog-max-len 128
